          });

    /* ==========================================================================
       4. APPLICATION STATE & LOCAL PERSISTENCE
       ========================================================================== */
    let currentView = 'home'; // 'home' | 'pyq_subfolders' | 'subject' | 'folder' | 'cbt_quiz' | 'quiz_result' | 'bookmarks_view'
    let currentSubjectId = null;
    let currentFolderId = null;

    let storedQuestions = [];
    let folderBatches = {};
    let mistakeNotebook = [];
    let bookmarkedQuestionIds = new Set();
    let userLang = 'dual';

    function loadLocalData() {
      try {
        const qRaw = localStorage.getItem('examprep_custom_questions');
        storedQuestions = qRaw ? JSON.parse(qRaw) : [...initialSeedQuestions];

        const mRaw = localStorage.getItem('examprep_mistake_notebook');
        mistakeNotebook = mRaw ? JSON.parse(mRaw) : [];

        const bRaw = localStorage.getItem('examprep_bookmarks');
        bookmarkedQuestionIds = new Set(bRaw ? JSON.parse(bRaw) : []);

        rebuildBatchesFromQuestions();
      } catch (e) {
        storedQuestions = [...initialSeedQuestions];
        rebuildBatchesFromQuestions();
      }
    }

    function saveLocalData() {
      try {
        localStorage.setItem('examprep_custom_questions', JSON.stringify(storedQuestions));
        localStorage.setItem('examprep_mistake_notebook', JSON.stringify(mistakeNotebook));
        localStorage.setItem('examprep_bookmarks', JSON.stringify(Array.from(bookmarkedQuestionIds)));
      } catch (e) {
        console.error("Local save error:", e);
      }
    }

    function rebuildBatchesFromQuestions() {
      folderBatches = {};
      storedQuestions.forEach((q, idx) => {
        const fId = q.subCategoryId;
        if (!fId) return;
        const bId = q.setId || `batch_${fId}_1`;
        const bTitle = q.setName || q.set?.name || q.set?.title || q.title || `Batch ${idx + 1}`;

        if (!folderBatches[fId]) folderBatches[fId] = [];
        let existing = folderBatches[fId].find(b => b.id === bId);
        if (!existing) {
          folderBatches[fId].push({
            id: bId,
            title: bTitle,
            name: bTitle,
            questionCount: 1,
            folderId: fId
          });
        } else {
          existing.questionCount++;
          if (bTitle && (!existing.title || existing.title === 'Batch 1')) {
            existing.title = bTitle;
            existing.name = bTitle;
          }
        }
      });
      updateBadges();
    }

    function updateBadges() {
      const elM = document.getElementById('mistakeBadgeCount');
      if (elM) elM.innerText = mistakeNotebook.length;
      const elB = document.getElementById('bookmarkBadgeCount');
      if (elB) elB.innerText = bookmarkedQuestionIds.size;
    }

    /* ==========================================================================
       5. FIREBASE TWO-WAY CLOUD SYNC
       ========================================================================== */
    function initFirebaseSync() {
      if (!db) return;

      db.collection('exam_batches').onSnapshot(snapshot => {
        if (!snapshot.empty) {
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.questions && Array.isArray(data.questions)) {
              data.questions.forEach(q => {
                if (!storedQuestions.some(sq => sq.id === q.id)) {
                  storedQuestions.push(q);
                }
              });
            }
          });
          rebuildBatchesFromQuestions();
          saveLocalData();
          if (currentView === 'folder') renderFolderBatchesView(document.getElementById('appRoot'));
        }
      }, err => console.warn("Firestore batches notice:", err));

      db.collection('mistake_notebook').onSnapshot(snapshot => {
        if (!snapshot.empty) {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          mistakeNotebook = list;
          saveLocalData();
          updateBadges();
        }
      }, err => console.warn("Firestore mistakes notice:", err));
    }

    async function syncBatchToFirestore(batchObj, questionsArr) {
      if (!db) return;
      try {
        await db.collection('exam_batches').doc(batchObj.id).set({
          id: batchObj.id,
          title: batchObj.title,
          folderId: batchObj.folderId,
          questionCount: questionsArr.length,
          questions: questionsArr,
          updatedAt: Date.now()
        }, { merge: true });
        showToast("Batch synced to Cloud Firestore!");
      } catch (e) {
        console.warn("Firestore save warning:", e);
      }
    }

    async function deleteBatchFromFirestore(batchId) {
      if (!db) return;
      try {
        await db.collection('exam_batches').doc(batchId).delete();
      } catch (e) {
        console.warn("Firestore delete warning:", e);
      }
    }

    /* ==========================================================================
       11. CBT MOCK TEST ENGINE & REAL-TIME STATE
       Features: Live Countdown Timer, Pause/Resume, Question Palette,
       Negative Marking (-0.25 / -0.5), Bilingual Toggle, Star Bookmark.
       ========================================================================== */
    let quizQuestions = [];
    let currentQuestionIdx = 0;
    let userAnswers = {};
    let markedForReview = new Set();
    let quizTimeRemaining = 0;
    let quizTimerInterval = null;
    let isQuizPaused = false;
    let isReattemptMode = false;

    function startCBTQuiz(batchId, batchTitle, folderId) {
      currentBatchId = batchId;
      currentBatchTitle = batchTitle;
      currentFolderId = folderId;
      isReattemptMode = false;

      quizQuestions = storedQuestions.filter(q => q.subCategoryId === folderId && (q.setId === batchId || (!q.setId && batchId.includes('_1'))));
      if (!quizQuestions.length) {
        quizQuestions = storedQuestions.filter(q => q.subCategoryId === folderId);
      }
      if (!quizQuestions.length) {
        showToast("No questions found in this batch.");
        return;
      }

      initQuizSession();
    }

    function startReattemptQuiz(questionsSubset, parentTitle) {
      if (!questionsSubset.length) {
        showToast("No incorrect or skipped questions to re-attempt.");
        return;
      }
      quizQuestions = [...questionsSubset];
      currentBatchTitle = `Re-attempt: ${parentTitle}`;
      isReattemptMode = true;
      initQuizSession();
    }

    function initQuizSession() {
      currentQuestionIdx = 0;
      userAnswers = {};
      markedForReview.clear();
      isQuizPaused = false;
      quizTimeRemaining = quizQuestions.length * 60; // 1 min per question

      clearInterval(quizTimerInterval);
      quizTimerInterval = setInterval(() => {
        if (!isQuizPaused && quizTimeRemaining > 0) {
          quizTimeRemaining--;
          updateTimerDisplay();
          if (quizTimeRemaining <= 0) {
            clearInterval(quizTimerInterval);
            submitCBTQuiz();
          }
        }
      }, 1000);

      currentView = 'cbt_quiz';
      renderApp();
    }

    function updateTimerDisplay() {
      const el = document.getElementById('quizTimerText');
      if (el) {
        const mins = Math.floor(quizTimeRemaining / 60);
        const secs = quizTimeRemaining % 60;
        el.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    }

    function toggleQuizPause() {
      isQuizPaused = !isQuizPaused;
      const btn = document.getElementById('pauseBtnText');
      if (btn) btn.innerText = isQuizPaused ? 'Resume' : 'Pause';
      showToast(isQuizPaused ? "Exam paused." : "Exam resumed.");
    }

    function toggleBookmarkInQuiz(qId) {
      if (bookmarkedQuestionIds.has(qId)) {
        bookmarkedQuestionIds.delete(qId);
        showToast("Question removed from Bookmarks.");
      } else {
        bookmarkedQuestionIds.add(qId);
        showToast("Question saved to Bookmarks!");
      }
      saveLocalData();
      updateBadges();
      renderApp();
    }

    function renderCBTQuizView(container) {
      const q = quizQuestions[currentQuestionIdx];
      const selected = userAnswers[q.id];
      const isMarked = markedForReview.has(q.id);
      const isBookmarked = bookmarkedQuestionIds.has(q.id);

      const mins = Math.floor(quizTimeRemaining / 60);
      const secs = quizTimeRemaining % 60;
      const formattedTimer = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      container.innerHTML = `
        <div class="space-y-4">
          <!-- CBT Top Header & Timer Bar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button onclick="confirmExitQuiz()" class="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-all" title="Exit Quiz">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
              </button>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-sm sm:text-base font-bold text-slate-900">${currentBatchTitle}</h2>

                <span id="pauseBtnText">${isQuizPaused ? 'Resume' : 'Pause'}</span>

                <button onclick="setQuizLang('kn')" class="px-2.5 py-1 rounded-lg ${userLang === 'kn' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600'}">ಕನ್ನಡ</button>
              </div>

              <!-- Submit Test Button -->
              <button onclick="submitCBTQuiz()" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition-all">
                Submit Test
              </button>
            </div>
          </div>

          <!-- Main Test Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <!-- Question Box -->
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between min-h-[460px]">
              <div class="space-y-6">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white text-xs font-bold font-mono flex items-center justify-center">${currentQuestionIdx + 1}</span>
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">${q.topic || q.examTag || 'General Awareness'}</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <!-- Bookmark Star Button -->
                    <button onclick="toggleBookmarkInQuiz('${q.id}')"
                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border ${isBookmarked ? 'bg-amber-50 text-amber-600 border-amber-300 font-bold' : 'bg-slate-50 text-slate-500 border-slate-200'} text-xs transition-all hover:bg-amber-50">
                      <i data-lucide="star" class="w-3.5 h-3.5 ${isBookmarked ? 'fill-amber-400 text-amber-500' : ''}"></i>
                      <span>${isBookmarked ? 'Bookmarked' : 'Bookmark'}</span>
                    </button>

                    <div class="flex items-center gap-1.5 text-xs font-semibold">
                      <span class="text-emerald-600 font-mono">+2.00</span>
                      <span class="text-slate-300">|</span>
                      <span class="text-rose-600 font-mono">-0.50</span>
                    </div>
                  </div>
                </div>

                <div class="space-y-3">
                  ${userLang !== 'kn' ? `<p class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">${q.question}</p>` : ''}
                  ${userLang !== 'en' && q.questionKn ? `<p class="text-base sm:text-lg font-medium text-indigo-950 font-kannada leading-relaxed bg-indigo-50/40 p-3 rounded-xl border border-indigo-100">${q.questionKn}</p>` : ''}
                </div>

                <div class="space-y-3 pt-2">
                  ${q.options.map((optEn, oIdx) => {
                    const optKn = (q.optionsKn && q.optionsKn[oIdx]) ? q.optionsKn[oIdx] : null;
                    const isSelected = selected === oIdx;

                    return `
                      <label onclick="selectAnswer('${q.id}', ${oIdx})"
                             class="flex items-start gap-3 p-3.5 rounded-xl border-2 cursor-pointer transition-all ${isSelected ? 'border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-500/20' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                        <input type="radio" name="opt_${q.id}" ${isSelected ? 'checked' : ''} class="mt-1 w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                        <div class="flex-1 space-y-1">
                          ${userLang !== 'kn' ? `<div class="text-sm font-semibold text-slate-800">${optEn}</div>` : ''}
                          ${userLang !== 'en' && optKn ? `<div class="text-sm font-medium text-indigo-900 font-kannada">${optKn}</div>` : ''}
                        </div>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Question Navigation Bar -->
              <div class="pt-6 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 mt-6">
                <div class="flex items-center gap-2">
                  <button onclick="toggleMarkForReview('${q.id}')" class="px-3.5 py-2 rounded-xl border ${isMarked ? 'bg-purple-100 text-purple-700 border-purple-300' : 'bg-slate-50 text-slate-700 border-slate-300'} hover:bg-slate-100 text-xs font-bold transition-all">
                    ${isMarked ? '★ Marked for Review' : '☆ Mark for Review'}
                  </button>
                  ${selected !== undefined ? `
                    <button onclick="clearAnswer('${q.id}')" class="px-3 py-2 rounded-xl text-rose-600 hover:bg-rose-50 text-xs font-semibold">
                      Clear Response
                    </button>
                  ` : ''}
                </div>

                <div class="flex items-center gap-2">
                  <button onclick="navigateQuestion(${currentQuestionIdx - 1})" ${currentQuestionIdx === 0 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs font-bold transition-all">
                    Previous
                  </button>
                  <button onclick="navigateQuestion(${currentQuestionIdx + 1})" ${currentQuestionIdx === quizQuestions.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-all">
                    Save & Next
                  </button>
                </div>
              </div>
            </div>

            <!-- CBT Question Palette -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Question Palette</h3>
              
              <div class="grid grid-cols-2 gap-2 text-[11px] font-medium text-slate-600">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500"></span> Answered</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-purple-500"></span> Review</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-200"></span> Not Visited</div>
              </div>

              <div class="grid grid-cols-5 gap-2 pt-2">
                ${quizQuestions.map((item, idx) => {
                  const isAns = userAnswers[item.id] !== undefined;
                  const isRev = markedForReview.has(item.id);
                  const isCur = idx === currentQuestionIdx;

                  let colorClass = "bg-slate-100 text-slate-700 hover:bg-slate-200";
                  if (isRev) colorClass = "bg-purple-600 text-white font-bold";
                  else if (isAns) colorClass = "bg-emerald-600 text-white font-bold";

                  return `
                    <button onclick="navigateQuestion(${idx})" class="w-9 h-9 rounded-xl text-xs font-mono transition-all flex items-center justify-center ${colorClass} ${isCur ? 'ring-2 ring-indigo-500 ring-offset-2' : ''}">
                      ${idx + 1}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function setQuizLang(lang) {
      userLang = lang;
      renderApp();
    }

    function selectAnswer(qId, oIdx) {
      userAnswers[qId] = oIdx;
      renderApp();
    }

    function clearAnswer(qId) {
      delete userAnswers[qId];
      renderApp();
    }

    function toggleMarkForReview(qId) {
      if (markedForReview.has(qId)) markedForReview.delete(qId);
      else markedForReview.add(qId);
      renderApp();
    }

    function navigateQuestion(newIdx) {
      if (newIdx >= 0 && newIdx < quizQuestions.length) {
        currentQuestionIdx = newIdx;
        renderApp();
      }
    }

    function confirmExitQuiz() {
      if (confirm("Are you sure you want to pause and exit this test? Your answers will be discarded.")) {
        clearInterval(quizTimerInterval);
        currentView = 'folder';
        renderApp();
      }
    }

    /* ==========================================================================
       12. VIEW 4: QUIZ RESULT, RE-ATTEMPT MODE & TOPIC PERFORMANCE ANALYTICS
       ========================================================================== */
    let lastQuizStats = null;
    let lastFailedQuestions = [];

    function submitCBTQuiz() {
      clearInterval(quizTimerInterval);

      let correct = 0;
      let wrong = 0;
      let unattempted = 0;
      const failed = [];
      const topicStats = {};

      quizQuestions.forEach(q => {
        const userAns = userAnswers[q.id];
        const topicName = q.topic || q.examTag || 'General';

        if (!topicStats[topicName]) {
          topicStats[topicName] = { total: 0, correct: 0, wrong: 0, unattempted: 0 };
        }
        topicStats[topicName].total++;

        if (userAns === undefined) {
          unattempted++;
          topicStats[topicName].unattempted++;
          failed.push(q);
        } else if (userAns === q.correctAnswerIndex) {
          correct++;
          topicStats[topicName].correct++;
        } else {
          wrong++;
          topicStats[topicName].wrong++;
          failed.push(q);
          saveMistakeItem(q, userAns);
        }
      });

      const totalScore = (correct * 2) - (wrong * 0.5);
      const accuracy = (correct + wrong) > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0;

      lastFailedQuestions = failed;
      lastQuizStats = {
        total: quizQuestions.length,
        correct,
        wrong,
        unattempted,
        score: totalScore,
        accuracy,
        batchTitle: currentBatchTitle,
        topicStats
      };

      currentView = 'quiz_result';
      renderApp();
    }

      if (!lastQuizStats) return navigateToHome();

      container.innerHTML = `
        <div class="space-y-6 max-w-4xl mx-auto">

          <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-md text-center space-y-6">
            <div>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100">
                <i data-lucide="award" class="w-4 h-4"></i>
                Performance Scorecard
              </span>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">${lastQuizStats.batchTitle}</h1>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-2xl mx-auto">
              <div class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-4">
                <span class="text-xs text-indigo-700 font-bold block mb-1">Final Score</span>
                <span class="text-2xl sm:text-3xl font-black text-indigo-900 font-mono">${lastQuizStats.score.toFixed(1)}</span>
              </div>
              <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4">
                <span class="text-xs text-emerald-700 font-bold block mb-1">Correct (+2.0)</span>
                <span class="text-2xl sm:text-3xl font-black text-emerald-800 font-mono">${lastQuizStats.correct}</span>
              </div>
              <div class="bg-rose-50 border border-rose-100 rounded-2xl p-4">
                <span class="text-xs text-rose-700 font-bold block mb-1">Wrong (-0.5)</span>
                <span class="text-2xl sm:text-3xl font-black text-rose-800 font-mono">${lastQuizStats.wrong}</span>
              </div>
              <div class="bg-amber-50 border border-amber-100 rounded-2xl p-4">
                <span class="text-xs text-amber-700 font-bold block mb-1">Accuracy</span>
                <span class="text-2xl sm:text-3xl font-black text-amber-800 font-mono">${lastQuizStats.accuracy}%</span>
              </div>
            </div>

            <!-- ACTION BUTTONS: RE-ATTEMPT MISTAKES & RETAKE -->
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              ${lastFailedQuestions.length > 0 ? `
                <button onclick="startReattemptQuiz(lastFailedQuestions, '${lastQuizStats.batchTitle.replace(/'/g, "\\'")}')"
                        class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm font-bold flex items-center gap-2 shadow-sm transition-all active:scale-95">
                  <i data-lucide="zap" class="w-4 h-4"></i>
                  <span>Re-attempt Incorrect Questions (${lastFailedQuestions.length})</span>
                </button>
              ` : ''}

              <button onclick="startCBTQuiz('${currentBatchId}', '${currentBatchTitle.replace(/'/g, "\\'")}', '${currentFolderId}')"
                      class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold flex items-center gap-2">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Retake Full Test</span>
              </button>

              <button onclick="currentView='folder'; renderApp();" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs sm:text-sm font-bold">
                Return to Folder
              </button>
            </div>
          </div>

          <!-- 4. WEAK VS STRONG AREAS PERFORMANCE ANALYTICS -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-600"></i>
                  <span>Weak vs Strong Areas (Topic-wise Breakdown)</span>
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Identify which concepts require focused revision</p>
              </div>
              <span class="text-xs font-bold text-slate-600 font-mono">${Object.keys(lastQuizStats.topicStats).length} Topics</span>
            </div>

            <div class="space-y-3">
              ${Object.entries(lastQuizStats.topicStats).map(([topic, stats]) => {
                const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
                const isStrong = acc >= 70;
                const isModerate = acc >= 40 && acc < 70;
                const isWeak = acc < 40;

                let badgeText = isStrong ? "Strong Area" : isModerate ? "Moderate" : "Weak Area (Focus)";
                let badgeClass = isStrong ? "bg-emerald-100 text-emerald-800 border-emerald-300" : isModerate ? "bg-amber-100 text-amber-800 border-amber-300" : "bg-rose-100 text-rose-800 border-rose-300";
                let barColor = isStrong ? "bg-emerald-500" : isModerate ? "bg-amber-500" : "bg-rose-500";

                return `
                  <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-xs sm:text-sm font-bold text-slate-900">${topic}</span>
                      <div class="flex items-center gap-2">
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${badgeClass}">
                          ${badgeText}
                        </span>
                        <span class="text-xs font-bold font-mono text-slate-800">${stats.correct}/${stats.total} (${acc}%)</span>
                      </div>
                    </div>
                    <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
                      <div class="h-full rounded-full ${barColor}" style="width: ${acc}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Untruncated Bilingual Solutions List -->
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="file-check" class="w-5 h-5 text-indigo-600"></i>
              <span>Detailed Question Solutions & Bilingual Explanations</span>
            </h2>

            <div class="space-y-4">
              ${quizQuestions.map((q, idx) => {
                const userAns = userAnswers[q.id];
                const isCorrect = userAns === q.correctAnswerIndex;
                const isSkipped = userAns === undefined;
                const isBookmarked = bookmarkedQuestionIds.has(q.id);

                return `
                  <div class="bg-white rounded-2xl border-2 ${isCorrect ? 'border-emerald-200' : isSkipped ? 'border-slate-200' : 'border-rose-200'} p-5 sm:p-6 space-y-4 shadow-sm">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-bold font-mono px-2.5 py-1 rounded-md ${isCorrect ? 'bg-emerald-100 text-emerald-800' : isSkipped ? 'bg-slate-100 text-slate-700' : 'bg-rose-100 text-rose-800'}">
                        Q${idx + 1} · ${isCorrect ? 'Correct (+2)' : isSkipped ? 'Not Attempted' : 'Incorrect (-0.5)'}
                      </span>
                      <div class="flex items-center gap-2">
                        <button onclick="toggleBookmarkInQuiz('${q.id}')" class="text-xs ${isBookmarked ? 'text-amber-600 font-bold' : 'text-slate-500'} hover:text-amber-600 flex items-center gap-1">
                          <i data-lucide="star" class="w-3.5 h-3.5 ${isBookmarked ? 'fill-amber-400 text-amber-500' : ''}"></i>
                          <span>${isBookmarked ? 'Bookmarked' : 'Bookmark'}</span>
                        </button>
                        <button onclick="saveMistakeItemDirectly('${q.id}')" class="text-xs text-rose-600 hover:text-rose-800 font-semibold flex items-center gap-1">
                          <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                          <span>Save Mistake</span>
                        </button>
                      </div>
                    </div>

                    <div class="space-y-1.5">
                      <p class="text-base font-semibold text-slate-900">${q.question}</p>
                      ${q.questionKn ? `<p class="text-sm font-medium text-indigo-950 font-kannada bg-indigo-50/30 p-2 rounded-lg">${q.questionKn}</p>` : ''}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                      ${q.options.map((opt, oIdx) => {
                        const isAnsOption = q.correctAnswerIndex === oIdx;
                        const isUserOption = userAns === oIdx;
                        let optStyle = "bg-slate-50 border-slate-200 text-slate-700";
                        if (isAnsOption) optStyle = "bg-emerald-50 border-emerald-400 text-emerald-900 font-bold";
                        else if (isUserOption) optStyle = "bg-rose-50 border-rose-400 text-rose-900 line-through";

                        return `
                          <div class="p-2.5 rounded-xl border ${optStyle} flex items-center justify-between">
                            <span>${opt}</span>
                            ${isAnsOption ? '<span class="text-emerald-700 font-bold">✓ Correct Answer</span>' : ''}
                          </div>
                        `;
                      }).join('')}
                    </div>

                    <div class="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100 space-y-2">
                      <div class="flex items-center gap-1.5 text-xs font-bold text-indigo-900">
                        <i data-lucide="info" class="w-4 h-4 text-indigo-600"></i>
                        <span>Deep Solution & Analysis (ಪೂರ್ಣ ವಿವರಣೆ):</span>
                      </div>
                      ${q.explanation ? `<p class="text-xs sm:text-sm text-slate-800 leading-relaxed">${q.explanation}</p>` : ''}
                      ${q.explanationKn ? `<p class="text-xs sm:text-sm text-indigo-950 font-kannada leading-relaxed pt-2 border-t border-indigo-100">${q.explanationKn}</p>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       13. BOOKMARKS LIST VIEW (Quick Revision Section)
       ========================================================================== */
    function openBookmarksView() {
      currentView = 'bookmarks_view';
      renderApp();
    }

    function renderBookmarksListView(container) {
      const bookmarkedList = storedQuestions.filter(q => bookmarkedQuestionIds.has(q.id));

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-200">
            <button onclick="navigateToHome()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs sm:text-sm font-semibold transition-all active:scale-95 shadow-xs w-fit">
              <i data-lucide="arrow-left" class="w-4 h-4 text-indigo-600"></i>
              <span>← Back to Dashboard</span>
            </button>
            <div class="text-xs text-slate-500 font-medium">Dashboard / Bookmarked Questions</div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold shadow-md">
                <i data-lucide="star" class="w-6 h-6 fill-white"></i>
              </div>
              <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Bookmarked Questions (${bookmarkedList.length})</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">High-priority questions starred during practice for fast revision</p>
              </div>
            </div>

            ${bookmarkedList.length > 0 ? `
              <button onclick="startCBTQuiz('bookmarks_custom', 'Bookmarked Questions Quiz', '${bookmarkedList[0].subCategoryId}')"
                      class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md transition-all active:scale-95">
                <i data-lucide="play" class="w-4 h-4"></i>
                <span>Practice All Bookmarks (${bookmarkedList.length})</span>
              </button>
            ` : ''}
          </div>

          <div class="space-y-4">
            ${bookmarkedList.length === 0 ? `
              <div class="py-14 px-6 text-center bg-white rounded-2xl border-2 border-dashed border-slate-300 space-y-3 max-w-md mx-auto">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mx-auto">
                  <i data-lucide="bookmark" class="w-6 h-6"></i>
                </div>
                <h3 class="text-base font-bold text-slate-900">No bookmarked questions yet</h3>
                <p class="text-xs text-slate-500">Tap the '★ Bookmark' button on any question during test practice to save it here for targeted revision.</p>
              </div>
            ` : bookmarkedList.map((q, idx) => `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4 shadow-xs">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-700">Question ${idx + 1}</span>
                  <button onclick="toggleBookmarkInQuiz('${q.id}')" class="text-xs text-rose-600 hover:text-rose-800 font-semibold flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Remove Bookmark</span>
                  </button>
                </div>

                <div class="space-y-1.5">
                  <p class="text-base font-semibold text-slate-900">${q.question}</p>
                  ${q.questionKn ? `<p class="text-sm font-medium text-indigo-950 font-kannada bg-indigo-50/40 p-2 rounded-lg">${q.questionKn}</p>` : ''}
                </div>

                <div class="text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 font-semibold">
                  Correct Answer: ${q.options[q.correctAnswerIndex]}
                </div>

                ${q.explanation ? `
                  <div class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1 leading-relaxed">
                    <span class="font-bold text-slate-800 block">Explanation:</span>
                    <p>${q.explanation}</p>
                    ${q.explanationKn ? `<p class="font-kannada text-indigo-900 pt-1 border-t border-slate-200">${q.explanationKn}</p>` : ''}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       14. MISTAKE NOTEBOOK ENGINE
       ========================================================================== */
    function saveMistakeItem(q, userSelectedIdx) {
      if (!mistakeNotebook.some(m => m.questionId === q.id)) {
        const item = {
          id: `mistake_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
          questionId: q.id,
          question: q.question,
          questionKn: q.questionKn,
          options: q.options,
          correctAnswerIndex: q.correctAnswerIndex,
          userSelectedIndex: userSelectedIdx,
          explanation: q.explanation,
          explanationKn: q.explanationKn,
          subjectId: q.subjectId,
          subCategoryId: q.subCategoryId,
          savedAt: Date.now()
        };
        mistakeNotebook.push(item);
        saveLocalData();
        if (db) {
          db.collection('mistake_notebook').doc(item.id).set(item).catch(() => {});
        }
      }
    }

    function saveMistakeItemDirectly(qId) {
      const q = storedQuestions.find(item => item.id === qId);
      if (q) {
        saveMistakeItem(q, userAnswers[qId] !== undefined ? userAnswers[qId] : -1);
        showToast("Added to Mistake Notebook!");
      }
    }

    function openMistakeNotebook() {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-900 text-white">
              <div class="flex items-center gap-2.5">
                <i data-lucide="book-open" class="w-5 h-5 text-rose-400"></i>
                <h3 class="font-bold text-base sm:text-lg">Mistake Notebook (${mistakeNotebook.length})</h3>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4 flex-1">
              ${mistakeNotebook.length === 0 ? `
                <div class="py-12 text-center text-slate-500 space-y-2">
                  <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mx-auto"></i>
                  <p class="font-bold">No mistakes recorded yet!</p>
                  <p class="text-xs">Questions answered incorrectly in CBT mock tests will automatically appear here for revision.</p>
                </div>
              ` : mistakeNotebook.map(m => `
                <div class="border border-slate-200 rounded-2xl p-4 space-y-3 bg-slate-50/50">
                  <div class="flex items-start justify-between gap-2">
                    <p class="text-xs sm:text-sm font-bold text-slate-900">${m.question}</p>
                    <button onclick="deleteMistake('${m.id}')" class="text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                  ${m.questionKn ? `<p class="text-xs text-indigo-950 font-kannada">${m.questionKn}</p>` : ''}
                  <div class="text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 font-semibold">
                    Correct: ${m.options ? m.options[m.correctAnswerIndex] : 'Option ' + (m.correctAnswerIndex + 1)}
                  </div>
                  ${m.explanation ? `<p class="text-xs text-slate-600 leading-relaxed bg-white p-3 rounded-xl border border-slate-200">${m.explanation}</p>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function deleteMistake(mId) {
      mistakeNotebook = mistakeNotebook.filter(m => m.id !== mId);
      saveLocalData();
      if (db) db.collection('mistake_notebook').doc(mId).delete().catch(() => {});
      openMistakeNotebook();
    }

    /* ==========================================================================
       15. ADD BATCH / UPLOAD JSON MODAL
       ========================================================================== */
    function openAddBatchModal(folderId) {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-900 text-white">
              <div class="flex items-center gap-2">
                <i data-lucide="upload-cloud" class="w-5 h-5 text-indigo-400"></i>
                <h3 class="font-bold text-base">Add Batch / Upload JSON</h3>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="p-6 overflow-y-auto space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Custom Batch Title (ಹೆಸರು / ಶೀರ್ಷಿಕೆ):</label>
                <input id="inputBatchTitle" type="text" placeholder="e.g. ಸಂವಿಧಾನದ ಪ್ರಮುಖ ವಿಧಿಗಳು - Batch 1, SSC CGL Tier 1 Mock 2"
                       class="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                <p class="text-[11px] text-slate-400 mt-1">If blank, it will auto-detect from JSON or default to 'Batch 1'.</p>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Upload .json File or Paste JSON Array:</label>
                <input type="file" id="jsonFileInput" accept=".json,application/json" onchange="handleFileSelect(event)" class="text-xs mb-2 block w-full">
                <textarea id="jsonTextInput" rows="6" placeholder='[ { "question": "What is...", "options": ["A","B","C","D"], "correctAnswerIndex": 0, "explanation": "..." } ]'
                          class="w-full text-xs font-mono p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
              </div>

              <button onclick="processBatchUpload('${folderId}')" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition-all">
                Save & Import Batch to Cloud
              </button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const text = ev.target.result;
        document.getElementById('jsonTextInput').value = text;
        try {
          const parsed = JSON.parse(text);
          const autoTitle = parsed.name || parsed.title || parsed.setName || (Array.isArray(parsed) && parsed[0] ? parsed[0].setName || parsed[0].set?.name || parsed[0].set?.title : '');
          if (autoTitle) document.getElementById('inputBatchTitle').value = autoTitle;
        } catch(err) {}
      };
      reader.readAsText(file);
    }

    function processBatchUpload(folderId) {
      const rawText = document.getElementById('jsonTextInput').value.trim();
      let inputTitle = document.getElementById('inputBatchTitle').value.trim();

      if (!rawText) {
        showToast("Please paste JSON or pick a .json file.");
        return;
      }

      try {
        const parsed = JSON.parse(rawText);
        const questionsList = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.data || []);
        if (!questionsList.length) {
          showToast("No questions found in JSON array.");
          return;
        }

        const autoTitle = parsed.name || parsed.title || parsed.setName || questionsList[0]?.setName || questionsList[0]?.set?.name || questionsList[0]?.set?.title || 'Batch 1';
        const finalTitle = inputTitle || autoTitle;
        const newBatchId = `batch_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

        const formatted = questionsList.map((q, idx) => ({
          id: q.id || `q_${Date.now()}_${idx}`,
          subjectId: currentSubjectId || 'pyq',
          subCategoryId: folderId,
          setId: newBatchId,
          setName: finalTitle,
          topic: q.topic || finalTitle,
          question: q.question || q.questionEn || `Question ${idx + 1}`,
          questionKn: q.questionKn || q.kannadaQuestion || null,
          options: q.options || q.optionsEn || ["A", "B", "C", "D"],
          optionsKn: q.optionsKn || null,
          correctAnswerIndex: typeof q.correctAnswerIndex === 'number' ? q.correctAnswerIndex : 0,
          explanation: q.explanation || q.explanationEn || "Detailed explanation provided.",
          explanationKn: q.explanationKn || null,
          examTag: q.examTag || finalTitle,
          difficulty: q.difficulty || "Medium",
          year: q.year || 2025
        }));

        storedQuestions.push(...formatted);
        rebuildBatchesFromQuestions();
        saveLocalData();

        const newBatchObj = { id: newBatchId, title: finalTitle, folderId: folderId };
        syncBatchToFirestore(newBatchObj, formatted);

        closeModal();
        showToast(`Batch '${finalTitle}' added successfully!`);
        renderFolderBatchesView(document.getElementById('appRoot'));
      } catch (e) {
        alert("Failed to parse JSON: " + e.message);
      }
    }

    function deleteBatch(batchId, folderId) {
      if (confirm("Are you sure you want to delete this question batch?")) {
        storedQuestions = storedQuestions.filter(q => q.setId !== batchId);
        rebuildBatchesFromQuestions();
        saveLocalData();
        deleteBatchFromFirestore(batchId);
        showToast("Batch deleted.");
        renderFolderBatchesView(document.getElementById('appRoot'));
      }
    }

    function closeModal() {
      document.getElementById('modalContainer').innerHTML = "";
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      if (toast && text) {
        text.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3200);
      }
    }

    /* ==========================================================================
       16. PWA INSTALLATION PROMPT
       ========================================================================== */
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.classList.remove('hidden');
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          const btn = document.getElementById('pwaInstallBtn');
          if (btn) btn.classList.add('hidden');
        });
      } else {
        alert("To install ExamPrep Pro on Mobile/Desktop:\nTap your browser menu (⋮ or Share) and select 'Add to Home Screen' / 'Install App'.");
      }
    }

    // App Initialization on Load
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalData();
      initFirebaseSync();
      renderApp();
    });
  </script>
</body>
